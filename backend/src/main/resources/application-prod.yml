# 生产 profile:本地 MySQL 8,自用日常,可用任意客户端查配置/日志
# 启动:java -jar devnest-backend.jar --spring.profiles.active=prod
# 首次需在 MySQL 创建库:CREATE DATABASE dev_nest DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dev_nest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: WARN
