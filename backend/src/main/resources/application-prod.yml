# 生产 profile:本地 MySQL 8,自用日常,可用任意客户端查配置/日志
# 启动:java -jar devnest-backend.jar --spring.profiles.active=prod
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/devnest?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: WARN
