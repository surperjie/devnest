server:
  port: 8080

spring:
  application:
    name: devnest-backend
  datasource:
    url: jdbc:mysql://localhost:3306/devnest?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# SSH 隧道配置(示例,按需调整)
ssh:
  tunnel:
    enabled: false
    host: 127.0.0.1
    port: 22
    user: tunnel
    password: ""
    local-port: 13306
    remote-host: 127.0.0.1
    remote-port: 3306

logging:
  level:
    com.devnest: debug
    org.hibernate.SQL: debug
