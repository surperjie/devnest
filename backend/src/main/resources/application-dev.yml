# 开发 profile:嵌入式 H2 文件库(MySQL 兼容模式),免安装秒级启动
# 启动:mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  datasource:
    url: jdbc:h2:file:~/devnest/devnest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
