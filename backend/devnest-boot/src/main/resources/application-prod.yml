# 生产 profile:外部 MySQL 8(自用日常),可用任意客户端查配置/日志.
#
# 凭据一律走环境变量,不落仓库(与 DEVNEST_SERVER_ADDRESS 同一约定):
#   DEVNEST_DB_URL       配置库 JDBC URL,默认本机 3306/dev_nest
#   DEVNEST_DB_USERNAME  配置库账号,默认 root
#   DEVNEST_DB_PASSWORD  配置库密码,无默认值 —— 必须显式注入,否则启动即连接失败
#
# 启动:java -jar devnest-backend.jar --spring.profiles.active=prod
# 本地免去手动设环境变量:把上述变量写进项目根 .env(已被 .gitignore 忽略),由 application.yml 自动导入.
# 首次需在 MySQL 创建库:CREATE DATABASE dev_nest DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
spring:
  datasource:
    url: ${DEVNEST_DB_URL:jdbc:mysql://localhost:3306/dev_nest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DEVNEST_DB_USERNAME:root}
    password: ${DEVNEST_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: WARN
