# DevNest 流水线:质量门禁 → 打包
#
# 为什么拆成两个 job(路线图 P0 task 0.1):
#   过去只有一个 job,而且打 jar 用的是 `mvn package -DskipTests` —— 测试从未被执行,
#   "CI 绿"只等价于"能编译",推不出"没坏"。整套架构自检(ArchUnit / 覆盖率 /
#   Testcontainers / 资源登记)都需要"测试真的跑起来"才有载体(路线图铁律 1)。
#
#   现在:
#     quality-gate(ubuntu)  跑 `mvn verify`:单测 + JaCoCo + enforcer + ArchUnit
#                           + Testcontainers(真实 MySQL/Redis 容器)+ 增量覆盖率门禁
#                           + OWASP 漏洞门禁(需 NVD_API_KEY secret,缺失时显式标注"未执行"),并把产物 jar 交出去。
#     build(windows)        needs: quality-gate,只做 Windows 打包(Tauri/jlink),
#                           直接下载上面那个 jar,因此全流程不存在 -DskipTests。
#
#   顺带解决两件事:
#     - 测试只在 Linux 跑一次,不再在 Windows 上重复一遍(省 ~10 分钟);
#     - Testcontainers 需要 Linux Docker,windows-2022 runner 上没有,放 ubuntu 才真跑得起来。
#
# Output artifacts:
#   - DevNest_x.x.x_x64-setup.exe (NSIS installer, includes bundled JRE 21)
#   - DevNest_x.x.x_x64_en-US.msi (MSI installer)
#
# @Author Ajiejiejie
name: Build Desktop App

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'frontend-ui/**'
      - 'scripts/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'

defaults:
  run:
    shell: pwsh

jobs:
  # ==========================================================================
  # Job 1 · 质量门禁 —— 唯一的"测试执行者",不产出安装包
  # ==========================================================================
  quality-gate:
    name: Quality Gate (tests + coverage + architecture + vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. Checkout(需要完整历史:增量覆盖率门禁要能解析基线 ref)
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Setup JDK 21
      # ============================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ============================================================
      # 3. Install DM JDBC driver (bundled in repo, not in Maven Central)
      #    这次不再"失败也放过":jar 就在仓库里,装不上说明构建输入坏了,
      #    让构建红比悄悄降级成"无 DM 支持"更诚实。
      # ============================================================
      - name: Install DM JDBC driver
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Continue'
          $jar = "lib/DmJdbcDriver18-8.1.3.140.jar"
          if (-not (Test-Path $jar)) {
            Write-Error "DM JDBC driver jar not found: $jar"
            exit 1
          }
          Write-Host "Installing DM JDBC driver from $jar"
          mvn install:install-file `
            "-Dfile=$jar" `
            '-DgroupId=com.dameng' `
            '-DartifactId=DmJdbcDriver18' `
            '-Dversion=8.1.3.140' `
            '-Dpackaging=jar' `
            -B -q
          if ($LASTEXITCODE -ne 0) {
            Write-Error "DM JDBC driver install failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "DM JDBC driver installed"

      # ============================================================
      # 4. Maven verify —— 四道门禁一次跑完
      #    enforcer(dependencyConvergence) / surefire 单测 / jacoco:check /
      #    ArchUnit 架构守护 / Testcontainers 集成测试 /
      #    dependency-check 漏洞门禁(CVSS >= ${owasp.fail-cvss} 即失败)
      #
      #    -Psecurity-scan:漏洞扫描需要下载 NVD 数据库,不能塞进每个人的本地
      #    verify;但它必须出现在 CI 里,否则就是"写在文档里的愿望"。
      #
      #    前提:NVD_API_KEY。NVD 对无凭据访问返回 403,且插件 9.x 起已无免 Key
      #    的数据源(见 backend/pom.xml)。所以这里不是无条件带 -Psecurity-scan,
      #    而是按 secret 是否存在决定 —— 缺 Key 时明确标注"本次未执行"。
      # ============================================================
      - name: Cache NVD database
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-nvd-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nvd-

      - name: Maven verify
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          $ErrorActionPreference = 'Continue'

          # 漏洞门禁的运行前提是 NVD_API_KEY:NVD 的 CVE 2.0 接口对无凭据访问
          # 返回 403,插件 9.x 起也不再有免 Key 的批量数据源(详见 backend/pom.xml
          # 中 security-scan profile 的注释)。
          #
          # key 缺失时不"假装通过",也不直接判红,而是显式标注【本次未执行】并写进
          # job summary —— 让 GitHub 界面上看得见"这条门禁这次没跑",而不是看不见的
          # 通过。配好 secret 后无需改任何代码,门禁自动生效并真的会拦人。
          $mvnArgs = @('-B', 'verify')
          if ([string]::IsNullOrWhiteSpace($env:NVD_API_KEY)) {
            Write-Host "::warning title=Vulnerability gate NOT executed::仓库未配置 NVD_API_KEY secret，本次运行未执行 OWASP dependency-check 漏洞门禁。请到 Settings -> Secrets and variables -> Actions 添加 NVD_API_KEY（免费申请：https://nvd.nist.gov/developers/request-an-api-key），门禁将自动生效。"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '### 漏洞门禁未执行 (Vulnerability gate NOT executed)'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '仓库未配置 `NVD_API_KEY` secret，本次运行为“测试 + 覆盖率 + 架构”门禁，**不含** OWASP dependency-check。'
          } else {
            $mvnArgs += '-Psecurity-scan'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '### 漏洞门禁已执行 (CVSS >= 7 即失败)'
          }

          Write-Host ("Running: mvn " + ($mvnArgs -join ' '))
          mvn @mvnArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Quality gate failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "All Maven gates passed"

      # ============================================================
      # 5. 增量行覆盖率门禁
      #    只卡"本次改动引入的、可执行却没被覆盖"的行。存量覆盖率另由
      #    jacoco:check 的棘轮地板看住,两者互补(路线图 P0 task 0.2)。
      #
      #    基线过远保护在脚本内部:把 dev 快进合并进 main 时,github.event.before
      #    还停在几十个提交之前,"本次改动"会退化成"整个分支历史",增量门禁随之
      #    退化成【存量全量门禁】(实测 22.6%,必然长期为红)。脚本检测到基线过远
      #    会自动回退到 HEAD~1 并打印 ::notice:: —— 回退是被宣布的降级,不是静默
      #    放行。阈值见脚本的 -MaxBaselineCommits / -MaxBaselineFiles。
      # ============================================================
      - name: Incremental line coverage gate
        run: |
          $ErrorActionPreference = 'Continue'

          # push 事件给的是上一个提交;workflow_dispatch 没有该字段,
          # 新建分支时 GitHub 会给全 0 的 sha —— 两种都回退到 HEAD~1。
          $base = '${{ github.event.before }}'
          $zeroSha = '0000000000000000000000000000000000000000'
          if ([string]::IsNullOrWhiteSpace($base) -or $base -eq $zeroSha) {
            $base = 'HEAD~1'
            Write-Host "::notice::no usable github.event.before, falling back to HEAD~1"
          }

          & ./scripts/check-incremental-coverage.ps1 -BaseRef $base -ShowDetail
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ============================================================
      # 6. 归档报告(失败也要拿到现场)
      # ============================================================
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/site/jacoco/**
            backend/**/target/dependency-check-report.*
          if-no-files-found: ignore

      # ============================================================
      # 7. 交出后端产物给 Job 2 —— 这是"打包 job 不跑测试"的前提
      # ============================================================
      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: devnest-boot-jar
          path: backend/devnest-boot/target/devnest-boot-1.0.0.jar
          if-no-files-found: error

  # ==========================================================================
  # Job 2 · 打包 —— 只做 Windows 原生打包,不再碰 Maven 测试
  # ==========================================================================
  build:
    name: Build Windows Desktop App
    needs: quality-gate
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v5

      # ============================================================
      # 2. Setup JDK 21 (Temurin) — 用于 jlink 生成随包 JRE
      # ============================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ============================================================
      # 3. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      # ============================================================
      # 4. Setup Rust (MSVC toolchain)
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend-ui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ============================================================
      # 5. 取回 Job 1 已验证过的后端 jar
      #    jar 是平台无关的 Java 字节码,在 Ubuntu 上构建、在 Windows 上打包完全等价。
      #    这样既保证"打包的东西一定是过过门禁的那一份",又不重复跑测试。
      # ============================================================
      - name: Download backend jar from quality gate
        uses: actions/download-artifact@v4
        with:
          name: devnest-boot-jar
          path: backend/devnest-boot/target

      - name: Verify jar exists
        run: |
          $jar = "backend/devnest-boot/target/devnest-boot-1.0.0.jar"
          if (-not (Test-Path $jar)) {
            Write-Error "Backend jar not found: $jar"
            exit 1
          }
          $size = [math]::Round((Get-Item $jar).Length / 1MB, 1)
          Write-Host "Backend jar: $size MB"

      # ============================================================
      # 6. Create minimal JRE 21 using jlink (bundled in app, no system JDK needed)
      #    Module list lives in scripts/build-jre.ps1 (single source of truth).
      #    MUST include jdk.unsupported: Spring AOP(CGLIB/Objenesis) 依赖
      #    sun.misc.Unsafe,缺失时 @Transactional 服务启动即抛
      #    NoClassDefFoundError -> "Unexpected AOP exception"(见 startup-repro)。
      # ============================================================
      - name: Create minimal JRE 21 with jlink
        run: |
          $ErrorActionPreference = 'Stop'
          & "scripts/build-jre.ps1" -JavaHome $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ============================================================
      # 7. Copy jar to Tauri resources
      # ============================================================
      - name: Copy jar to Tauri resources
        run: |
          $resourcesDir = "frontend-ui/src-tauri/resources"
          if (-not (Test-Path $resourcesDir)) {
            New-Item -ItemType Directory -Path $resourcesDir -Force | Out-Null
          }
          Copy-Item "backend/devnest-boot/target/devnest-boot-1.0.0.jar" `
                    "$resourcesDir/devnest-boot.jar" -Force
          Write-Host "Jar copied to Tauri resources"

      # ============================================================
      # 8. Smoke test: boot backend with the bundled JRE before packaging.
      #    Guards against future jlink module omissions (e.g. jdk.unsupported
      #    -> NoClassDefFoundError: sun/misc/Unsafe -> "Unexpected AOP exception").
      # ============================================================
      - name: Smoke test backend with bundled JRE
        run: |
          $ErrorActionPreference = 'Stop'
          $java = "frontend-ui/src-tauri/resources/jre21/bin/java.exe"
          $jar  = "frontend-ui/src-tauri/resources/devnest-boot.jar"
          if (-not (Test-Path $java)) { Write-Error "Bundled JRE missing: $java"; exit 1 }
          if (-not (Test-Path $jar))  { Write-Error "Backend jar missing: $jar"; exit 1 }

          $log = Join-Path $env:RUNNER_TEMP "devnest-smoke.log"
          $err = "$log.err"
          $p = Start-Process -FilePath $java `
                -ArgumentList '-jar', $jar, '--spring.profiles.active=dev', '--server.port=38099', '--spring.main.banner-mode=off' `
                -RedirectStandardOutput $log -RedirectStandardError $err `
                -PassThru -WindowStyle Hidden

          function Dump-Logs {
            Write-Host "--- stdout ---"
            Get-Content $log -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content $err -ErrorAction SilentlyContinue
          }

          $deadline = (Get-Date).AddSeconds(90)
          $started = $false
          while ((Get-Date) -lt $deadline -and -not $started) {
            Start-Sleep -Seconds 3
            if ($p.HasExited) {
              Dump-Logs
              Write-Error "Backend exited before startup, code=$($p.ExitCode)"
            }
            if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match 'Started DevNestApplication') {
              $started = $true
            }
          }

          if ($started) {
            Write-Host "Smoke test PASSED: bundled JRE can boot the backend"
          } else {
            Dump-Logs
            if (-not $p.HasExited) { $p.Kill() }
            Write-Error "Backend did not start within 90s using bundled JRE"
          }
          if (-not $p.HasExited) { $p.Kill() }

      # ============================================================
      # 9. Install frontend dependencies
      # ============================================================
      - name: Install frontend dependencies
        working-directory: frontend-ui
        run: npm ci

      # ============================================================
      # 10. Build Tauri app (frontend + Rust + JRE + jar -> exe/msi)
      # ============================================================
      - name: Build Tauri app
        working-directory: frontend-ui
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Building Tauri app (this may take 10-20 minutes on first run)..."
          Write-Host "Bundled resources:"
          if (Test-Path "src-tauri/resources/jre21/bin/java.exe") {
            $jreSize = [math]::Round((Get-ChildItem -Recurse "src-tauri/resources/jre21" | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
            Write-Host "  JRE 21: $jreSize MB"
          } else {
            Write-Host "  JRE 21: NOT FOUND (will fallback to system java)"
          }
          if (Test-Path "src-tauri/resources/devnest-boot.jar") {
            $jarSize = [math]::Round((Get-Item "src-tauri/resources/devnest-boot.jar").Length / 1MB, 1)
            Write-Host "  Backend jar: $jarSize MB"
          }
          npm run tauri build 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "Tauri build failed (exit $exitCode)"
            Write-Host "::group::Debug: bundle directory contents"
            if (Test-Path "src-tauri/target/release/bundle") {
              Get-ChildItem -Recurse "src-tauri/target/release/bundle" | Select-Object FullName, Length
            } else {
              Write-Host "Bundle directory not found"
            }
            Write-Host "::endgroup"
            exit 1
          }
          Write-Host "Tauri build completed successfully"

      # ============================================================
      # 11. Upload artifacts
      # ============================================================
      - name: Find build outputs
        id: find
        run: |
          $bundleDir = "frontend-ui/src-tauri/target/release/bundle"
          $msi = Get-ChildItem "$bundleDir/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem "$bundleDir/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($msi) { Write-Host "MSI: $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)" }
          if ($nsis) { Write-Host "EXE: $($nsis.Name) ($([math]::Round($nsis.Length/1MB,1)) MB)" }
          if (-not $msi -and -not $nsis) {
            Write-Host "::warning::No installer files found in bundle directory"
            if (Test-Path $bundleDir) {
              Get-ChildItem -Recurse $bundleDir | Select-Object FullName
            } else {
              Write-Host "Bundle directory does not exist"
            }
          }

          if ($msi) { echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT }
          if ($nsis) { echo "exe_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Upload NSIS installer
        if: steps.find.outputs.exe_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: DevNest-Windows-Setup
          path: ${{ steps.find.outputs.exe_path }}
          if-no-files-found: warn

      - name: Upload MSI installer
        if: steps.find.outputs.msi_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: DevNest-Windows-MSI
          path: ${{ steps.find.outputs.msi_path }}
          if-no-files-found: warn

      # ============================================================
      # 12. Summary
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          Write-Host "========================================"
          Write-Host " Build: ${{ job.status }}"
          Write-Host " Branch: ${{ github.ref_name }}"
          Write-Host " Commit: ${{ github.sha }}"
          Write-Host "========================================"
