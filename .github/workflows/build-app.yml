# DevNest Desktop App Build Pipeline
# Push to dev/main or trigger manually to build Windows exe + msi
#
# Output artifacts:
#   - DevNest_x.x.x_x64-setup.exe (NSIS installer, includes bundled JRE 21)
#   - DevNest_x.x.x_x64_en-US.msi (MSI installer)
#
# @Author Ajiejiejie
name: Build Desktop App

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'frontend-ui/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build Windows Desktop App
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v5

      # ============================================================
      # 2. Setup JDK 21 (Temurin) — used for Maven build AND jlink JRE
      # ============================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ============================================================
      # 3. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      # ============================================================
      # 4. Setup Rust (MSVC toolchain)
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend-ui/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ============================================================
      # 5. Create minimal JRE 21 using jlink (bundled in app, no system JDK needed)
      # ============================================================
      - name: Create minimal JRE 21 with jlink
        run: |
          $ErrorActionPreference = 'Continue'
          $jreDir = "frontend-ui/src-tauri/resources/jre21"
          if (Test-Path $jreDir) {
            Write-Host "JRE already exists, skipping jlink"
          } else {
            Write-Host "Creating minimal JRE 21 with jlink..."
            jlink `
              --add-modules java.base,java.desktop,java.management,java.naming,java.sql,java.instrument,java.net.http,java.scripting,java.transaction.xa,java.compiler,java.xml,java.security.jgss,java.rmi `
              --output $jreDir `
              --no-header-files `
              --no-man-pages `
              --compress=2
            if ($LASTEXITCODE -ne 0) {
              Write-Error "jlink failed (exit $LASTEXITCODE)"
              exit 1
            }
            $size = [math]::Round((Get-ChildItem -Recurse $jreDir | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
            Write-Host "JRE 21 created: $size MB at $jreDir"
          }

      # ============================================================
      # 6. Install DM JDBC driver (bundled in repo, not in Maven Central)
      # ============================================================
      - name: Install DM JDBC driver
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Continue'
          $jar = "lib/DmJdbcDriver18-8.1.3.140.jar"
          if (Test-Path $jar) {
            Write-Host "Installing DM JDBC driver from $jar"
            mvn install:install-file `
              "-Dfile=$jar" `
              '-DgroupId=com.dameng' `
              '-DartifactId=DmJdbcDriver18' `
              '-Dversion=8.1.3.140' `
              '-Dpackaging=jar' `
              -B -q
            if ($LASTEXITCODE -eq 0) {
              Write-Host "DM JDBC driver installed successfully"
            } else {
              Write-Host "::warning::DM JDBC driver install failed (exit $LASTEXITCODE), building without DM support"
            }
          } else {
            Write-Host "::warning::DM JDBC driver jar not found, building without DM support"
          }

      # ============================================================
      # 7. Build backend Spring Boot jar
      # ============================================================
      - name: Build backend jar
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Building backend with Maven..."
          mvn package -DskipTests -B -q
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Backend build failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Backend build completed"

      - name: Verify jar exists
        working-directory: backend
        run: |
          $jar = "devnest-boot/target/devnest-boot-1.0.0.jar"
          if (-not (Test-Path $jar)) {
            Write-Error "Backend jar not found: $jar"
            exit 1
          }
          $size = [math]::Round((Get-Item $jar).Length / 1MB, 1)
          Write-Host "Backend jar: $size MB"

      # ============================================================
      # 8. Copy jar to Tauri resources
      # ============================================================
      - name: Copy jar to Tauri resources
        run: |
          $resourcesDir = "frontend-ui/src-tauri/resources"
          if (-not (Test-Path $resourcesDir)) {
            New-Item -ItemType Directory -Path $resourcesDir -Force | Out-Null
          }
          Copy-Item "backend/devnest-boot/target/devnest-boot-1.0.0.jar" `
                    "$resourcesDir/devnest-boot.jar" -Force
          Write-Host "Jar copied to Tauri resources"

      # ============================================================
      # 9. Install frontend dependencies
      # ============================================================
      - name: Install frontend dependencies
        working-directory: frontend-ui
        run: npm ci

      # ============================================================
      # 10. Build Tauri app (frontend + Rust + JRE + jar -> exe/msi)
      # ============================================================
      - name: Build Tauri app
        working-directory: frontend-ui
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Building Tauri app (this may take 10-20 minutes on first run)..."
          Write-Host "Bundled resources:"
          if (Test-Path "src-tauri/resources/jre21/bin/java.exe") {
            $jreSize = [math]::Round((Get-ChildItem -Recurse "src-tauri/resources/jre21" | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
            Write-Host "  JRE 21: $jreSize MB"
          } else {
            Write-Host "  JRE 21: NOT FOUND (will fallback to system java)"
          }
          if (Test-Path "src-tauri/resources/devnest-boot.jar") {
            $jarSize = [math]::Round((Get-Item "src-tauri/resources/devnest-boot.jar").Length / 1MB, 1)
            Write-Host "  Backend jar: $jarSize MB"
          }
          npm run tauri build 2>&1
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "Tauri build failed (exit $exitCode)"
            Write-Host "::group::Debug: bundle directory contents"
            if (Test-Path "src-tauri/target/release/bundle") {
              Get-ChildItem -Recurse "src-tauri/target/release/bundle" | Select-Object FullName, Length
            } else {
              Write-Host "Bundle directory not found"
            }
            Write-Host "::endgroup"
            exit 1
          }
          Write-Host "Tauri build completed successfully"

      # ============================================================
      # 11. Upload artifacts
      # ============================================================
      - name: Find build outputs
        id: find
        run: |
          $bundleDir = "frontend-ui/src-tauri/target/release/bundle"
          $msi = Get-ChildItem "$bundleDir/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem "$bundleDir/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($msi) { Write-Host "MSI: $($msi.Name) ($([math]::Round($msi.Length/1MB,1)) MB)" }
          if ($nsis) { Write-Host "EXE: $($nsis.Name) ($([math]::Round($nsis.Length/1MB,1)) MB)" }
          if (-not $msi -and -not $nsis) {
            Write-Host "::warning::No installer files found in bundle directory"
            if (Test-Path $bundleDir) {
              Get-ChildItem -Recurse $bundleDir | Select-Object FullName
            } else {
              Write-Host "Bundle directory does not exist"
            }
          }

          if ($msi) { echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT }
          if ($nsis) { echo "exe_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Upload NSIS installer
        if: steps.find.outputs.exe_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: DevNest-Windows-Setup
          path: ${{ steps.find.outputs.exe_path }}
          if-no-files-found: warn

      - name: Upload MSI installer
        if: steps.find.outputs.msi_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: DevNest-Windows-MSI
          path: ${{ steps.find.outputs.msi_path }}
          if-no-files-found: warn

      # ============================================================
      # 12. Summary
      # ============================================================
      - name: Build summary
        if: always()
        run: |
          Write-Host "========================================"
          Write-Host " Build: ${{ job.status }}"
          Write-Host " Branch: ${{ github.ref_name }}"
          Write-Host " Commit: ${{ github.sha }}"
          Write-Host "========================================"
